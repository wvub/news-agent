name: News Update

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -r requirements.txt

    - name: Run News Agent Scraper
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: |
        python news_agent.py

    - name: Commit and Push changes
      run: |
        # FIX 1: prevents "fatal: detected dubious ownership" exit 128
        git config --global --add safe.directory "$GITHUB_WORKSPACE"

        git config --local user.email "action@github.com"
        git config --local user.name "news-bot"

        git add .
        echo "--- changed files ---"
        git status --short

        # nothing changed? done.
        git diff-index --quiet HEAD -- && { echo "No changes."; exit 0; }

        git commit -m "news update $(date -u)"

        # FIX 2: retry pattern — rebase then push, retry once if rejected
        git pull --rebase origin main
        git push origin main || {
          echo "Push rejected, retrying after rebase..."
          git pull --rebase origin main
          git push origin main
        }
