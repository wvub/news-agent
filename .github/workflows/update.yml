name: News Update

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write

# never let two runs race each other on news.json
concurrency:
  group: news-update
  cancel-in-progress: false

jobs:
  update-news:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - name: Checkout repository
      uses: actions/checkout@v5
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -r requirements.txt

    - name: Run News Agent Scraper
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        TRANSLATE_LANGS: ${{ vars.TRANSLATE_LANGS }}
        GOOGLE_FACTCHECK_KEY: ${{ secrets.GOOGLE_FACTCHECK_KEY }}
        REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
        REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
        SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
        SMTP_PORT: ${{ secrets.SMTP_PORT }}
        SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
        SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
      run: |
        python news_agent.py

    - name: Commit and Push changes
      run: |
        # FIX 1: prevents "fatal: detected dubious ownership" exit 128
        git config --global --add safe.directory "$GITHUB_WORKSPACE"

        git config --local user.email "action@github.com"
        git config --local user.name "news-bot"

        git add .
        echo "--- changed files ---"
        git status --short

        # nothing changed? done.
        git diff-index --quiet HEAD -- && { echo "No changes."; exit 0; }

        git commit -m "news update $(date -u)"

        # FIX 2: retry pattern — rebase then push, retry once if rejected
        # retry: rebase onto latest main then push (generated files: prefer ours on conflict)
        for i in 1 2 3; do
          git pull --rebase -X theirs origin main && git push origin main && exit 0
          echo "Push attempt $i failed, retrying..."
          git rebase --abort 2>/dev/null || true
          sleep $((i * 5))
        done
        exit 1
